# Compatibility: some large games and launchers create very many VMAs.
vm.max_map_count = 2147483642

# Avoid aggressively swapping game memory. zram remains available as a safety net.
vm.swappiness = 10

# Keep file descriptor capacity comfortably above desktop defaults.
fs.file-max = 2097152

# Preserve security mitigations. No kernel.unprivileged_bpf_disabled relaxation,
# no split-lock disable, no mitigations=off and no watchdog disabling here.
