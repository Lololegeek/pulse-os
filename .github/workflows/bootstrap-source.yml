name: Bootstrap PulseOS source

on:
  push:
    branches: [main]
    paths:
      - .pulseos-bootstrap-ready

permissions:
  contents: write

jobs:
  import-source:
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout bootstrap repository
        uses: actions/checkout@v4

      - name: Import complete PulseOS source tree
        shell: bash
        run: |
          set -euo pipefail
          cat pulseos-source.part-* > /tmp/pulseos-source.tar.gz.b64
          base64 --decode /tmp/pulseos-source.tar.gz.b64 > /tmp/pulseos-source.tar.gz
          tar -tzf /tmp/pulseos-source.tar.gz >/dev/null
          tar -xzf /tmp/pulseos-source.tar.gz -C .

          # GitHub's Actions token cannot create/update workflow files. Keep the
          # bootstrap workflow untouched and let the GitHub connector install
          # the real CI workflows immediately after this source import.
          rm -f .github/workflows/build-image.yml
          rm -f .github/workflows/build-nvidia.yml
          rm -f .github/workflows/verify.yml

          rm -f pulseos-source.tar.gz.b64 pulseos-source.part-* .pulseos-bootstrap-ready

      - name: Commit imported source
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "feat: import complete PulseOS open-source distribution"
          git push origin HEAD:main
