name: Build ISO

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: pulseos-iso-${{ github.ref }}
  cancel-in-progress: true

jobs:
  iso:
    name: Build installable PulseOS ISO
    runs-on: ubuntu-24.04
    timeout-minutes: 180

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Free runner disk space
        run: |
          sudo rm -rf /usr/local/lib/android /usr/share/dotnet /opt/ghc || true
          sudo apt-get clean
          df -h /

      - name: Install build tools
        run: |
          sudo apt-get update
          sudo apt-get install -y podman shellcheck
          sudo podman --version

      - name: Verify source tree
        run: ./scripts/verify.sh

      - name: Compute artifact name
        id: meta
        shell: bash
        run: |
          set -euo pipefail
          version="$(tr -d '[:space:]' < VERSION)"
          short_sha="${GITHUB_SHA::7}"
          echo "version=$version" >> "$GITHUB_OUTPUT"
          echo "short_sha=$short_sha" >> "$GITHUB_OUTPUT"

      - name: Build PulseOS bootc image
        run: |
          sudo podman build \
            --pull=newer \
            -t localhost/pulse-os:ci \
            -f Containerfile .

      - name: Build installer image
        run: |
          sudo podman build \
            --pull=newer \
            --build-arg PULSEOS_SOURCE_REF=localhost/pulse-os:ci \
            --build-arg PULSEOS_UPDATE_REF=ghcr.io/lololegeek/pulse-os:edge \
            -t localhost/pulse-os-installer:ci \
            -f installer/Containerfile .

      - name: Build ISO
        run: |
          mkdir -p output
          ./scripts/build-iso.sh \
            localhost/pulse-os-installer:ci \
            localhost/pulse-os:ci \
            output

      - name: Prepare ISO artifact
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p release
          iso="$(find output -type f -name '*.iso' -print -quit)"
          if [[ -z "$iso" ]]; then
            echo "No ISO was produced" >&2
            find output -maxdepth 5 -type f -ls || true
            exit 1
          fi
          name="PulseOS-Gaming-${{ steps.meta.outputs.version }}-${{ steps.meta.outputs.short_sha }}.iso"
          cp "$iso" "release/$name"
          (cd release && sha256sum "$name" > "$name.sha256")
          ls -lh release

      - name: Upload ISO
        uses: actions/upload-artifact@v4
        with:
          name: PulseOS-ISO-${{ steps.meta.outputs.version }}-${{ steps.meta.outputs.short_sha }}
          path: release/*
          if-no-files-found: error
          retention-days: 14
