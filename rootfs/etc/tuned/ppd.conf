[main]
default=balanced
battery_detection=true
sysfs_acpi_monitor=true

[profiles]
power-saver=powersave
balanced=balanced
# Gaming mode requests the PPD performance profile. Map that request to TuneD's
# latency-oriented profile instead of throughput-performance.
performance=latency-performance

[battery]
# Stay balanced on battery until a game explicitly requests performance.
balanced=balanced
