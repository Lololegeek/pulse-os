[general]
reaper_freq=5
desiredgov=performance
desiredprof=performance
igpu_desiredgov=powersave
igpu_power_threshold=0.30
softrealtime=off
renice=5
ioprio=0
inhibit_screensaver=1
# Keep the split-lock mitigation enabled for security/reliability.
disable_splitlock=0

[gpu]
# PulseOS never overclocks the GPU automatically.
apply_gpu_optimisations=0

[cpu]
# scx_lavd handles topology-aware placement. Avoid stacking pinning heuristics.
park_cores=no
pin_cores=no

[custom]
start=/usr/libexec/pulseos/game-mode start
end=/usr/libexec/pulseos/game-mode stop
script_timeout=10
