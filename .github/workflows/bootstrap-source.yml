name: Bootstrap PulseOS source

on:
  push:
    branches: [main]
    paths:
      - pulseos-source.tar.gz.b64

permissions:
  contents: write

jobs:
  import-source:
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout bootstrap repository
        uses: actions/checkout@v4

      - name: Import complete PulseOS source tree
        shell: bash
        run: |
          set -euo pipefail
          base64 --decode pulseos-source.tar.gz.b64 > /tmp/pulseos-source.tar.gz
          tar -xzf /tmp/pulseos-source.tar.gz -C .
          rm -f pulseos-source.tar.gz.b64
          rm -f .github/workflows/bootstrap-source.yml

      - name: Commit imported source
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "feat: import complete PulseOS open-source distribution"
          git push origin HEAD:main
